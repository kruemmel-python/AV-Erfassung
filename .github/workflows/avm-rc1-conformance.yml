name: AVM RC1 Clean Conformance

on:
  push:
    paths:
      - "AV_Modular/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "AV_Modular/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: AV_Modular
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bind immutable source identity
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne "${{ github.sha }}") { throw "Checkout does not match workflow commit" }
          if (git status --porcelain) { throw "Checkout is dirty" }
          "AVM_SOURCE_COMMIT=$commit" >> $env:GITHUB_ENV
          "AVM_SOURCE_DIRTY=false" >> $env:GITHUB_ENV
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          cache: false
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install isolated Android SDK 36
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "android-sdk-36"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          Copy-Item -Recurse -Force (Join-Path $env:ANDROID_HOME "licenses") (Join-Path $sdk "licenses")
          sdkmanager "--sdk_root=$sdk" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
      - name: Clean RC1 build
        shell: msys2 {0}
        env:
          AVM_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ./gradlew.bat --no-daemon clean --warning-mode=all
          ./gradlew.bat --no-daemon avmReleaseCandidate --warning-mode=all
      - name: Upload signed evidence and release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: avm-1.0.0-rc1-${{ github.run_id }}
          if-no-files-found: error
          path: |
            AV_Modular/build/distributions/**
            AV_Modular/build/reports/avm-conformance.json
            AV_Modular/enterprise/capture-android/build/outputs/apk/debug/*.apk
